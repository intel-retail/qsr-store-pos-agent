listener 1883
protocol mqtt

listener 9001
protocol websockets

# Anonymous access is disabled. The compose files generate this password file at
# container start from MQTT_USERNAME / MQTT_PASSWORD. When running Mosquitto
# natively, create it with "mosquitto_passwd -c <file> <user>" and point
# password_file at it.
allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/
