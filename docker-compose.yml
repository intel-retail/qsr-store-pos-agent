services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-posdev2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh
      - ./database/grocery/schema.sql:/docker-entrypoint-initdb.d/grocery-schema.sql
      - ./database/cafe/schema.sql:/docker-entrypoint-initdb.d/cafe-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-posdev2024}
      GROCERY_DB_NAME: pos_grocery
      CAFE_DB_NAME: pos_cafe
      CAFE_TABLE_COUNT: ${CAFE_TABLE_COUNT:-15}
      HERMES_API_KEY: ${HERMES_API_KEY:-change-me-local-dev}
      HERMES_GATEWAY_URL: ${HERMES_GATEWAY_URL:-http://host.docker.internal:3001}
      MQTT_BROKER_URL: mqtt://mqtt:1883
      QMMD_URL: http://host.docker.internal:9101
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # MQTT Broker (for table status events)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: pos-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data

  # GPU Metrics Daemon (system-wide Intel GPU metrics via Prometheus)
  qmmd:
    build:
      context: ./qmmd
      dockerfile: Dockerfile
    container_name: pos-qmmd
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    security_opt:
      - apparmor:unconfined
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /sys:/sys
      - /proc:/proc:ro
      - /run:/run:ro

volumes:
  postgres_data:
  mqtt_data:
